<!--
  BodyHolics mark: a weight plate seen face on, with a square hub.

  One bold form, no text, no gradient. It survives 16x16 because it is a heavy
  orange disc against a solid ground. The square hub is what stops it reading
  as a generic circle at small sizes — that single detail is the whole mark.

  Ground is iron dark rather than white so the same artwork works as an opaque
  iOS icon and as a maskable Android icon with no separate treatment.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#141413"/>
  <circle cx="256" cy="256" r="186" fill="#E1502A"/>
  <rect x="171" y="171" width="170" height="170" rx="16" fill="#141413"/>
</svg>
