<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Urban Gym Admin</title>
    <style>
      :root {
        color-scheme: dark;
        --ink-950: #0a0d11;
        --ink-400: #98a1af;
        --ink-0: #ffffff;
        --accent-500: #12b76a;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--ink-950);
        color: var(--ink-0);
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      h1 {
        margin: 1.25rem 0 0.5rem;
        font-size: 1.375rem;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        max-width: 28ch;
        color: var(--ink-400);
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 14px;
      }
    </style>
  </head>
  <body>
    <div>
      <img src="/icons/icon-192.png" alt="" />
      <h1>No connection</h1>
      <p>
        The console needs the network to show member data. Reconnect and this page will load
        normally.
      </p>
    </div>
  </body>
</html>
