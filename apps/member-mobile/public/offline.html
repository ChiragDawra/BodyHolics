<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Urban Gym</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #0a0d11;
        color: #ffffff;
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      h1 {
        margin: 1.25rem 0 0.5rem;
        font-size: 1.375rem;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        max-width: 30ch;
        color: #98a1af;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 14px;
      }
    </style>
  </head>
  <body>
    <div>
      <img src="/icons/icon-192.png" alt="" />
      <h1>No connection</h1>
      <p>Urban Gym needs the network to load your membership. Reconnect and pull to refresh.</p>
    </div>
  </body>
</html>
